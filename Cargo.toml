[package]
name = "quadtree-collision"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Anibal Flores"]
description = "Rust + WebAssembly boids and elastic-collision sandbox accelerated by a dynamic QuadTree."
license = "MIT"
repository = "https://github.com/Deadlici0us/Quadtree-Collision"
readme = "README.md"
exclude = ["/pkg", "/www", "/docs/screenshots", "/.github", "/target"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = "0.5"

[[bench]]
name = "quadtree"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
